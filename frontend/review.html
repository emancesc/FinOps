<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinOps — Revisione Tag</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <a class="brand" href="index.html">FinOps Tagging</a>
    <a href="index.html">Setup Account</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="inventory.html">Inventario</a>
    <a href="proposals.html">Proposta Tagging</a>
    <a href="review.html" class="active">Revisione Tag</a>
    <a href="rules.html">Regole</a>
    <a href="graph.html">Grafo</a>
  </nav>
  <main>
    <h1>Revisione Proposte di Tag</h1>
    <div class="card">
      <div class="form-row">
        <div class="form-group">
          <label for="f-status">Stato</label>
          <select id="f-status">
            <option value="">Tutti</option><option value="pending">Da rivedere</option><option value="approved">Approvate</option>
            <option value="edited">Modificate</option><option value="rejected">Rifiutate</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-tag">Tag</label>
          <select id="f-tag"><option value="">Tutti</option></select>
        </div>
        <div class="form-group">
          <label for="f-text">Cerca (risorsa, valore, motivazione)</label>
          <input type="text" id="f-text" placeholder="es. vol-, UNIBO, Oracle" />
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="f-invalid" /> Solo valori non ammessi</label>
        </div>
      </div>
      <div class="form-row" style="align-items:center; gap:0.5rem; flex-wrap:wrap">
        <button type="button" class="btn btn-secondary btn-sm" id="btn-select-all">Seleziona tutte (filtro)</button>
        <button type="button" class="btn btn-secondary btn-sm" id="btn-select-none">Deseleziona</button>
        <button type="button" class="btn btn-success btn-sm" id="btn-approve-selected" disabled>Approva selezionate</button>
        <button type="button" class="btn btn-danger btn-sm" id="btn-reject-selected" disabled>Rifiuta selezionate</button>
        <button type="button" class="btn btn-primary btn-sm" id="btn-approve-all">Approva tutte da rivedere</button>
        <a class="btn btn-secondary btn-sm" id="btn-export" href="#">Esporta XLSX</a>
        <span class="muted" id="selection"></span>
      </div>
      <p class="muted" id="count"></p>
      <div class="table-wrap">
        <table id="proposals-table" class="compact">
          <thead>
            <tr><th><input type="checkbox" id="chk-page" title="Seleziona le righe mostrate" /></th><th>Risorsa</th><th>Tag</th><th>Attuale</th><th>Proposto</th><th>Conf.</th><th>Fonte</th><th>Motivazione</th><th>Stato</th><th></th></tr>
          </thead>
          <tbody id="proposals-body">
            <tr><td colspan="10" style="text-align:center; color:#6b7280;">Caricamento…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const jobId = params.get("job_id") || localStorage.getItem("last_job_id");
    const runId = params.get("run_id");
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let proposals = [];
    let filtered = [];
    const selected = new Set();

    function badgeHtml(status) {
      const cls = { pending: "badge-pending", approved: "badge-approved", rejected: "badge-rejected", edited: "badge-proposed" }[status] || "";
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }

    function render() {
      const status = document.getElementById("f-status").value;
      const tag = document.getElementById("f-tag").value;
      const text = document.getElementById("f-text").value.trim().toLowerCase();
      const onlyInvalid = document.getElementById("f-invalid").checked;
      const rows = filtered = proposals.filter((p) => (!status || p.review_status === status) && (!tag || p.tag_key === tag)
        && (!onlyInvalid || (p.reasoning || "").startsWith("[VALORE NON AMMESSO"))
        && (!text || [p.resource_id, p.tag_value, p.reasoning].join(" ").toLowerCase().includes(text)));
      document.getElementById("count").textContent = `${rows.length} proposte` + (rows.length > 1000 ? " (mostrate le prime 1000)" : "")
        + (runId ? " — esecuzione selezionata" : "");
      const tbody = document.getElementById("proposals-body");
      updateSelection();
      if (!rows.length) { tbody.innerHTML = "<tr><td colspan='10' style='text-align:center'>Nessuna proposta.</td></tr>"; return; }
      tbody.innerHTML = rows.slice(0, 1000).map((p) => `
        <tr>
          <td><input type="checkbox" class="chk-row" data-id="${p.id}" ${selected.has(p.id) ? "checked" : ""} /></td>
          <td title="${esc(p.resource_id)}"><div>${esc(p.resource_id.split(":").slice(5).join(":") || p.resource_id)}</div>
            <div class="muted">${esc(p.resource_type)} — ${esc(p.region)}</div></td>
          <td>${esc(p.tag_key)}</td>
          <td class="muted">${esc(p.current_value ?? "—")}</td>
          <td><strong>${esc(p.tag_value ?? "—")}</strong></td>
          <td>${p.confidence != null ? Math.round(p.confidence * 100) + "%" : "—"}</td>
          <td class="muted" title="${esc(p.source_ref || "")}">${esc(p.source_type)}${p.source_ref ? "<br>" + esc(p.source_ref) : ""}</td>
          <td class="muted" style="max-width:360px">${esc(p.reasoning || "")}</td>
          <td>${badgeHtml(p.review_status)}</td>
          <td style="white-space:nowrap">
            <button class="btn btn-success btn-sm" onclick="review('${p.id}','approved')" title="Approva">✓</button>
            <button class="btn btn-secondary btn-sm" onclick="editValue('${p.id}')" title="Modifica valore">✎</button>
            <button class="btn btn-danger btn-sm" onclick="review('${p.id}','rejected')" title="Rifiuta">✗</button>
          </td>
        </tr>`).join("");
    }

    function updateSelection() {
      const shown = filtered.slice(0, 1000);
      document.getElementById("selection").textContent = selected.size ? `${selected.size} selezionate` : "";
      document.getElementById("btn-approve-selected").disabled = !selected.size;
      document.getElementById("btn-reject-selected").disabled = !selected.size;
      document.getElementById("chk-page").checked = shown.length > 0 && shown.every((p) => selected.has(p.id));
    }

    async function bulkReview(ids, status, label) {
      if (!ids.length) return;
      if (!confirm(`${label}: ${ids.length} proposte. Confermi?`)) return;
      try {
        const r = await api.bulkReviewProposals(jobId, ids, status);
        selected.clear();
        await loadProposals();
        document.getElementById("selection").textContent = `${r.updated} proposte aggiornate (${status})`;
      } catch (err) { alert("Errore: " + err.message); }
    }

    async function loadProposals() {
      if (!jobId) { document.getElementById("proposals-body").innerHTML = "<tr><td colspan='10'>Nessun job selezionato.</td></tr>"; return; }
      try {
        proposals = await api.listProposals(jobId, runId ? { run_id: runId } : {});
        const tags = [...new Set(proposals.map((p) => p.tag_key))].sort();
        document.getElementById("f-tag").innerHTML = '<option value="">Tutti</option>' + tags.map((t) => `<option>${esc(t)}</option>`).join("");
        render();
      } catch (err) {
        document.getElementById("proposals-body").innerHTML = `<tr><td colspan='10'>Errore: ${esc(err.message)}</td></tr>`;
      }
    }

    async function review(id, status) {
      try { await api.reviewProposal(id, { review_status: status }); await loadProposals(); } catch (err) { alert("Errore: " + err.message); }
    }

    async function editValue(id) {
      const p = proposals.find((x) => x.id === id);
      const value = prompt(`Nuovo valore per ${p.tag_key}`, p.tag_value || "");
      if (value === null) return;
      try { await api.reviewProposal(id, { tag_value: value }); await loadProposals(); } catch (err) { alert("Errore: " + err.message); }
    }

    ["f-status", "f-tag", "f-invalid"].forEach((id) => document.getElementById(id).addEventListener("change", render));
    document.getElementById("f-text").addEventListener("input", render);
    document.getElementById("proposals-body").addEventListener("change", (e) => {
      if (!e.target.classList.contains("chk-row")) return;
      e.target.checked ? selected.add(e.target.dataset.id) : selected.delete(e.target.dataset.id);
      updateSelection();
    });
    document.getElementById("chk-page").addEventListener("change", (e) => {
      filtered.slice(0, 1000).forEach((p) => (e.target.checked ? selected.add(p.id) : selected.delete(p.id)));
      render();
    });
    // tutte le proposte che rispettano il filtro corrente, anche oltre le 1000 mostrate
    document.getElementById("btn-select-all").addEventListener("click", () => { filtered.forEach((p) => selected.add(p.id)); render(); });
    document.getElementById("btn-select-none").addEventListener("click", () => { selected.clear(); render(); });
    document.getElementById("btn-approve-selected").addEventListener("click", () =>
      bulkReview([...selected], "approved", "Approva selezionate"));
    document.getElementById("btn-reject-selected").addEventListener("click", () =>
      bulkReview([...selected], "rejected", "Rifiuta selezionate"));
    document.getElementById("btn-approve-all").addEventListener("click", () =>
      bulkReview(proposals.filter((p) => p.review_status === "pending").map((p) => p.id), "approved",
        "Approva tutte le proposte da rivedere" + (runId ? " dell'esecuzione selezionata" : " del job")));
    if (jobId) document.getElementById("btn-export").href = api.proposalsExportUrl(jobId, runId);
    loadProposals();
  </script>
</body>
</html>
