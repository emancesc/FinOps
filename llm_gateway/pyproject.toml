[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_gateway"
version = "0.1.0"
description = "Shared LLM client with unified interface for Claude and Azure OpenAI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_gateway*"]
